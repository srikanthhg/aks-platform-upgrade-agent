pid /tmp/nginx.pid;
events {}
http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  include /etc/nginx/mime.types;
  server { listen 8080; server_name _; root /usr/share/nginx/html; index index.html;
    add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; add_header Referrer-Policy no-referrer always;
    location / { try_files $uri $uri/ /index.html; }
    location = /health { access_log off; return 200 'healthy'; add_header Content-Type text/plain; }
  }
}
