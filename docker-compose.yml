services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aks_upgrade_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aks_upgrade_agent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: ./backend
    environment: &backend-env
      APP_ENVIRONMENT: development
      AUTH_MODE: api_key
      APP_API_KEY: local-development-key
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aks_upgrade_agent
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      ALLOW_REAL_UPGRADES: "false"
      DEFAULT_DRY_RUN: "true"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ./backend
    environment: *backend-env
    command: ["python", "worker.py"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_ENTRA_TENANT_ID: local
        VITE_ENTRA_CLIENT_ID: local
        VITE_API_SCOPE: api://local/AKS.Upgrade
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:8080"
    depends_on:
      - api

volumes:
  postgres-data:
