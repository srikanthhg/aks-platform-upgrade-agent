name: CI

on:
  workflow_dispatch:
  # pull_request:
  #   branches: [main]
  # push:
  #   branches: [main]

permissions:
  contents: read
  id-token: write

env:
  DOCKERHUB_BACKEND_IMAGE: srikanthhg/aks-upgrade-agent-backend
  DOCKERHUB_FRONTEND_IMAGE: srikanthhg/aks-upgrade-agent-frontend

jobs:
  backend:
    name: Backend - Test & Compile
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aks_upgrade_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aks_upgrade_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aks_upgrade_agent
      AUTH_MODE: api_key
      APP_API_KEY: test-key
      APP_ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Compile Python
        run: python -m compileall -q .

      - name: Run unit tests
        run: PYTHONPATH=. pytest -q

  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

  repository:
    name: Repository - Verify Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify repository
        run: python scripts/verify_repository.py

  images:
    if: github.event_name == 'workflow_dispatch'
    name: Docker - Build & Push Images
    runs-on: ubuntu-latest
    needs: [backend, frontend, repository]
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tags
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "image_tag=sha-${SHORT_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_BACKEND_IMAGE }}:latest
            ${{ env.DOCKERHUB_BACKEND_IMAGE }}:${{ steps.meta.outputs.image_tag }}
          provenance: false

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_FRONTEND_IMAGE }}:latest
            ${{ env.DOCKERHUB_FRONTEND_IMAGE }}:${{ steps.meta.outputs.image_tag }}
          provenance: false
          build-args: |
            VITE_ENTRA_TENANT_ID=${{ secrets.VITE_ENTRA_TENANT_ID }}
            VITE_ENTRA_CLIENT_ID=${{ secrets.VITE_ENTRA_CLIENT_ID }}
            VITE_API_SCOPE=${{ secrets.VITE_API_SCOPE }}

  deploy:
    if: github.event_name == 'workflow_dispatch'
    name: Configure Backend Ingress & Deploy Frontend
    runs-on: ubuntu-latest
    needs: images
    steps:
      - name: Validate deployment configuration
        env:
          BACKEND_API_HOST: ${{ vars.BACKEND_API_HOST }}
          BACKEND_CONTAINER_APP_NAME: ${{ vars.BACKEND_CONTAINER_APP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          FRONTEND_CONTAINER_APP_NAME: ${{ vars.FRONTEND_CONTAINER_APP_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          for name in BACKEND_API_HOST BACKEND_CONTAINER_APP_NAME AZURE_RESOURCE_GROUP FRONTEND_CONTAINER_APP_NAME; do
            if [[ -z "${!name}" ]]; then
              echo "::error::GitHub repository variable ${name} is not configured."
              exit 1
            fi
          done
          if [[ "${BACKEND_API_HOST}" == *"://"* || "${BACKEND_API_HOST}" == */* || "${BACKEND_API_HOST}" == *:* ]]; then
            echo "::error::BACKEND_API_HOST must be the backend internal FQDN hostname only, without scheme, port, or path."
            exit 1
          fi

      - name: Sign in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify backend is internal and use HTTP/1.1-compatible ingress transport
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          BACKEND_CONTAINER_APP_NAME: ${{ vars.BACKEND_CONTAINER_APP_NAME }}
          BACKEND_API_HOST: ${{ vars.BACKEND_API_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_INGRESS_EXTERNAL="$(az containerapp show \
            --name "${BACKEND_CONTAINER_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query 'properties.configuration.ingress.external' -o tsv)"
          BACKEND_FQDN="$(az containerapp show \
            --name "${BACKEND_CONTAINER_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)"

          if [[ "${BACKEND_INGRESS_EXTERNAL}" != "false" ]]; then
            echo "::error::Backend ingress must remain internal (external=false). No ingress exposure was changed."
            exit 1
          fi
          if [[ "${BACKEND_FQDN,,}" != "${BACKEND_API_HOST,,}" ]]; then
            echo "::error::BACKEND_API_HOST does not match the backend Container App ingress FQDN."
            exit 1
          fi

          # FastAPI/Uvicorn serves HTTP/1.1. ACA ingress transport=HTTP2 can
          # return 426 when the container only speaks HTTP/1.1. Auto negotiates
          # a compatible protocol while preserving the internal ingress scope.
          az containerapp ingress update \
            --name "${BACKEND_CONTAINER_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --transport auto

      - name: Deploy frontend image and configure runtime backend hostname
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          FRONTEND_CONTAINER_APP_NAME: ${{ vars.FRONTEND_CONTAINER_APP_NAME }}
          BACKEND_API_HOST: ${{ vars.BACKEND_API_HOST }}
          FRONTEND_IMAGE: ${{ env.DOCKERHUB_FRONTEND_IMAGE }}:${{ needs.images.outputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          az containerapp update \
            --name "${FRONTEND_CONTAINER_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --image "${FRONTEND_IMAGE}" \
            --set-env-vars "BACKEND_API_HOST=${BACKEND_API_HOST}"
