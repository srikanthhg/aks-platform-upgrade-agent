name: CI

on:
  workflow_dispatch:
    
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aks_upgrade_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aks_upgrade_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aks_upgrade_agent
      AUTH_MODE: api_key
      APP_API_KEY: test-key
      APP_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q .
      - run: PYTHONPATH=. pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/verify_repository.py

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend, repository]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: aks-upgrade-agent-backend:ci
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: aks-upgrade-agent-frontend:ci
          build-args: |
            VITE_ENTRA_TENANT_ID=test
            VITE_ENTRA_CLIENT_ID=test
            VITE_API_SCOPE=api://test/AKS.Upgrade
            VITE_API_BASE_URL=https://api.example.invalid/api/v1
