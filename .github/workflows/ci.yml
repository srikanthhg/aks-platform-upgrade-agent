name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOCKERHUB_BACKEND_IMAGE: srikanthhg/aks-upgrade-agent-backend
  DOCKERHUB_FRONTEND_IMAGE: srikanthhg/aks-upgrade-agent-frontend

jobs:
  backend:
    name: Backend - Test & Compile
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aks_upgrade_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aks_upgrade_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aks_upgrade_agent
      AUTH_MODE: api_key
      APP_API_KEY: test-key
      APP_ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Compile Python
        run: python -m compileall -q .

      - name: Run unit tests
        run: PYTHONPATH=. pytest -q

  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

  repository:
    name: Repository - Verify Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify repository
        run: python scripts/verify_repository.py

  images:
    name: Docker - Build & Push Images
    runs-on: ubuntu-latest
    needs: [backend, frontend, repository]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tags
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "backend_tags=${DOCKERHUB_BACKEND_IMAGE}:latest,${DOCKERHUB_BACKEND_IMAGE}:sha-${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "frontend_tags=${DOCKERHUB_FRONTEND_IMAGE}:latest,${DOCKERHUB_FRONTEND_IMAGE}:sha-${SHORT_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_BACKEND_IMAGE }}:latest
            ${{ env.DOCKERHUB_BACKEND_IMAGE }}:sha-${{ steps.meta.outputs.short_sha }}
          provenance: false

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_FRONTEND_IMAGE }}:latest
            ${{ env.DOCKERHUB_FRONTEND_IMAGE }}:sha-${{ steps.meta.outputs.short_sha }}
          provenance: false
          build-args: |
            VITE_ENTRA_TENANT_ID={{ secrets.VITE_ENTRA_TENANT_ID }}
            VITE_ENTRA_CLIENT_ID={{ secrets.VITE_ENTRA_CLIENT_ID }}
            VITE_API_SCOPE={{ secrets.VITE_API_SCOPE }}
            VITE_API_BASE_URL={{ secrets.VITE_API_BASE_URL }}
